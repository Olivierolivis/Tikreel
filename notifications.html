<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Notifications — TikReel</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { theme: { extend: { colors: { tikreel: { red: '#FF1744', orange: '#FF6D00', black: '#080808' } }, fontFamily: { sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'] } } } }
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="font-sans" style="background:var(--bg-app)">

<div class="flex min-h-[100dvh] w-full">
  <aside class="hidden md:flex flex-col w-64 flex-shrink-0 border-r border-subtle px-3 py-4 h-[100dvh] sticky top-0" id="sidebar-nav"></aside>

  <main class="flex-1 pb-24 md:pb-10 page-fade-in">
    <div class="max-w-2xl mx-auto px-4 pt-6 md:pt-8">
      <div class="flex items-center justify-between mb-4">
        <h1 class="text-2xl font-black">Notifications</h1>
        <button id="mark-read-btn" class="text-xs font-semibold text-[#FF1744]">Mark all read</button>
      </div>
      <div id="notif-list" class="flex flex-col divide-y divide-subtle border-t border-subtle"></div>
      <div id="notif-empty" class="hidden flex-col items-center justify-center gap-2 text-secondary py-20 text-center">
        <i data-lucide="bell-off" class="w-10 h-10"></i>
        <p class="font-semibold">No notifications yet</p>
        <p class="text-sm">Likes, follows, saves, and comments will show up here.</p>
      </div>
    </div>
  </main>
</div>

<nav id="mobile-nav" class="md:hidden fixed bottom-0 inset-x-0 z-40 surface border-t border-subtle flex items-center justify-around px-2 py-2 backdrop-blur"></nav>

<script src="js/storage.js"></script>
<script src="js/api.js"></script>
<script src="js/likes.js"></script>
<script src="js/ui.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    Store.markAllNotificationsRead();
    UI.init('notifications.html');
    render();
    document.getElementById('mark-read-btn').addEventListener('click', () => {
      Store.markAllNotificationsRead();
      render();
    });
  });

  function render() {
    const list = Store.getNotifications();
    const el = document.getElementById('notif-list');
    const empty = document.getElementById('notif-empty');
    if (list.length === 0) {
      el.classList.add('hidden');
      empty.classList.remove('hidden');
      empty.classList.add('flex');
      return;
    }
    el.classList.remove('hidden');
    empty.classList.add('hidden');
    el.innerHTML = list.map(n => `
      <div class="flex items-center gap-3 py-3.5 ${n.read ? '' : 'bg-[#FF1744]/5'}">
        <span class="w-9 h-9 rounded-full brand-gradient flex items-center justify-center flex-shrink-0">
          <i data-lucide="${n.icon}" class="w-4 h-4 text-white"></i>
        </span>
        <div class="flex-1 min-w-0">
          <p class="text-sm">${n.text}</p>
          <p class="text-xs text-secondary">${timeAgo(n.createdAt)}</p>
        </div>
        ${!n.read ? '<span class="w-2 h-2 rounded-full bg-[#FF1744] flex-shrink-0"></span>' : ''}
      </div>
    `).join('');
    if (window.lucide) lucide.createIcons({ nodes: [el] });
  }

  function timeAgo(ts) {
    const s = Math.floor((Date.now() - ts) / 1000);
    if (s < 60) return 'just now';
    if (s < 3600) return Math.floor(s / 60) + 'm ago';
    if (s < 86400) return Math.floor(s / 3600) + 'h ago';
    return Math.floor(s / 86400) + 'd ago';
  }
</script>
</body>
</html>
