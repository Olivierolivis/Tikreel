<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Discover — TikReel</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { theme: { extend: { colors: { tikreel: { red: '#FF1744', orange: '#FF6D00', black: '#080808' } }, fontFamily: { sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'] } } } }
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="font-sans" style="background:var(--bg-app)">

<div class="flex min-h-[100dvh] w-full">
  <aside class="hidden md:flex flex-col w-64 flex-shrink-0 border-r border-subtle px-3 py-4 h-[100dvh] sticky top-0" id="sidebar-nav"></aside>

  <main class="flex-1 pb-24 md:pb-10 page-fade-in">
    <div class="max-w-3xl mx-auto px-4 pt-6 md:pt-8">
      <h1 class="text-2xl font-black mb-4">Discover</h1>

      <!-- Search -->
      <div class="relative mb-6">
        <i data-lucide="search" class="w-4 h-4 absolute left-4 top-1/2 -translate-y-1/2 text-secondary"></i>
        <input id="search-input" type="text" placeholder="Search videos, creators, hashtags..." class="w-full muted-surface rounded-full pl-11 pr-4 py-3 text-sm outline-none focus:ring-2 focus:ring-[#FF1744]/40">
      </div>

      <div id="search-history-wrap" class="mb-6 hidden">
        <div class="flex items-center justify-between mb-2">
          <span class="text-xs font-semibold text-secondary">Recent searches</span>
          <button id="clear-history-btn" class="text-xs text-[#FF1744] font-semibold">Clear</button>
        </div>
        <div id="search-history" class="flex flex-wrap gap-2"></div>
      </div>

      <!-- Trending hashtags -->
      <section class="mb-8">
        <h2 class="text-sm font-bold mb-3 flex items-center gap-1.5"><i data-lucide="hash" class="w-4 h-4 text-[#FF1744]"></i>Trending hashtags</h2>
        <div id="hashtag-cards" class="grid grid-cols-2 sm:grid-cols-3 gap-3"></div>
      </section>

      <!-- Categories -->
      <section class="mb-8">
        <h2 class="text-sm font-bold mb-3 flex items-center gap-1.5"><i data-lucide="layout-grid" class="w-4 h-4 text-[#FF6D00]"></i>Categories</h2>
        <div id="category-cards" class="grid grid-cols-3 sm:grid-cols-4 gap-3"></div>
      </section>

      <!-- Trending / popular grid -->
      <section>
        <h2 class="text-sm font-bold mb-3 flex items-center gap-1.5"><i data-lucide="flame" class="w-4 h-4 text-[#FF1744]"></i>Popular right now</h2>
        <div id="popular-grid" class="grid grid-cols-3 gap-1.5"></div>
        <div id="popular-loading" class="grid grid-cols-3 gap-1.5"></div>
      </section>
    </div>
  </main>
</div>

<nav id="mobile-nav" class="md:hidden fixed bottom-0 inset-x-0 z-40 surface border-t border-subtle flex items-center justify-around px-2 py-2 backdrop-blur"></nav>

<script src="js/storage.js"></script>
<script src="js/api.js"></script>
<script src="js/feed.js"></script>
<script src="js/likes.js"></script>
<script src="js/ui.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', async () => {
    UI.init('discover.html');

    // Search
    const searchInput = document.getElementById('search-input');
    searchInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && searchInput.value.trim()) {
        window.location.href = `index.html?search=${encodeURIComponent(searchInput.value.trim())}`;
      }
    });
    function renderHistory() {
      const hist = Store.getSearchHistory();
      const wrap = document.getElementById('search-history-wrap');
      const el = document.getElementById('search-history');
      wrap.classList.toggle('hidden', hist.length === 0);
      el.innerHTML = hist.map(h => `<button class="history-chip muted-surface text-xs px-3 py-1.5 rounded-full" data-term="${h}">${h}</button>`).join('');
      el.querySelectorAll('.history-chip').forEach(btn => {
        btn.addEventListener('click', () => window.location.href = `index.html?search=${encodeURIComponent(btn.dataset.term)}`);
      });
    }
    renderHistory();
    document.getElementById('clear-history-btn').addEventListener('click', () => {
      Store.clearSearchHistory();
      renderHistory();
    });

    // Hashtags
    const hashtags = await Api.getTrendingHashtags();
    document.getElementById('hashtag-cards').innerHTML = hashtags.map((h, i) => `
      <a href="index.html?search=${encodeURIComponent(h.replace('#',''))}" class="relative rounded-xl overflow-hidden p-4 flex flex-col justify-end h-20 hashtag-card" style="background:linear-gradient(135deg, rgba(255,23,68,${0.55 - i*0.03}), rgba(255,109,0,${0.35 - i*0.02}))">
        <span class="text-white font-bold text-sm">${h}</span>
        <span class="text-white/70 text-[11px]">${(120 + i * 37)}K views</span>
      </a>
    `).join('');

    // Categories
    const categories = [
      ['music','Music','music'], ['comedy','Comedy','laugh'], ['travel','Travel','plane'],
      ['food','Food','utensils'], ['fashion','Fashion','shirt'], ['gaming','Gaming','gamepad-2'],
      ['technology','Technology','cpu'], ['sports','Sports','trophy'], ['nature','Nature','trees'],
      ['animals','Animals','paw-print'], ['education','Education','graduation-cap'],
    ];
    document.getElementById('category-cards').innerHTML = categories.map(([key, label, icon]) => `
      <a href="index.html?category=${key}" class="flex flex-col items-center gap-2 muted-surface rounded-xl py-4 hover:brand-gradient hover:text-white transition group">
        <i data-lucide="${icon}" class="w-5 h-5"></i>
        <span class="text-xs font-semibold">${label}</span>
      </a>
    `).join('');

    if (window.lucide) lucide.createIcons();

    // Popular grid
    const loading = document.getElementById('popular-loading');
    for (let i = 0; i < 9; i++) {
      const sk = document.createElement('div');
      sk.className = 'aspect-[9/16] rounded-md skeleton-shimmer';
      loading.appendChild(sk);
    }
    try {
      const videos = await Api.getPopularVideos(1, 12);
      loading.remove();
      const grid = document.getElementById('popular-grid');
      grid.innerHTML = videos.map(v => `
        <a href="index.html?search=${encodeURIComponent((v.tags[0]||'trending').replace('#',''))}" class="relative aspect-[9/16] rounded-md overflow-hidden bg-black/40 group">
          <img src="${v.poster}" class="w-full h-full object-cover group-hover:scale-105 transition" loading="lazy">
          <div class="absolute inset-0 bg-gradient-to-t from-black/60 to-transparent"></div>
          <span class="absolute bottom-1.5 left-1.5 text-white text-[11px] font-semibold flex items-center gap-1"><i data-lucide="play" class="w-3 h-3 fill-white"></i>${(1.2 + (v.sourceId % 90) / 10).toFixed(1)}K</span>
        </a>
      `).join('');
      if (window.lucide) lucide.createIcons({ nodes: [grid] });
    } catch (err) {
      loading.innerHTML = `<p class="col-span-3 text-center text-secondary text-sm py-8">Unable to load videos. Try again.</p>`;
    }
  });
</script>
</body>
</html>
